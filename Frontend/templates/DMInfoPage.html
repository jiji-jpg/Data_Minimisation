<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Minimisation - FlameTree Cyber</title>
  <style>
    /* RESET */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      line-height: 1.6; 
      color: #374151;
      background: #f9fafb;
    }

    /* NAVBAR */
    #site-header { min-height: 60px; }

    /* HERO - SMALLER & TIGHTER */
    .hero {
      display: grid;
      grid-template-columns: 1fr 380px;  /* ← Smaller image */
      gap: 2.5rem;                       /* ← Tighter gap */
      max-width: 1100px;                 /* ← Narrower container */
      margin: 2.5rem auto;               /* ← Less top/bottom margin */
      padding: 0 1.5rem;
      align-items: center;
    }

    .hero-content h1 {
      font-size: clamp(2rem, 4.5vw, 3rem);  /* ← Smaller text */
      font-weight: 800;
      background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
      margin-bottom: 1rem;                   /* ← Less spacing */
    }

    .hero-content p {
      font-size: 1.125rem;                   /* ← Smaller text */
      color: #64748b;
      margin-bottom: 1.75rem;                /* ← Less spacing */
      max-width: 420px;
    }

    .hero-buttons {
      display: flex;
      gap: 0.75rem;                          /* ← Tighter buttons */
      flex-wrap: wrap;
    }

    .btn {
      padding: 0.875rem 1.75rem;             /* ← Smaller buttons */
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: white;
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4);
    }

    .btn-secondary {
      background: transparent;
      color: #3b82f6;
      border: 2px solid #3b82f6;
    }

    .btn-secondary:hover {
      background: #3b82f6;
      color: white;
    }

    /* IMAGE WITH SHADOW */
    .hero-image {
      position: relative;
    }

    .hero-image::before {
      content: '';
      position: absolute;
      top: 8px; right: 8px;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.4), rgba(16, 185, 129, 0.3));
      border-radius: 20px;                   /* ← Matches image shadow */
      z-index: -1;
      filter: blur(20px);
      opacity: 0.8;
    }

    .hero-image img {
      width: 100%;
      height: auto;
      position: relative;
      z-index: 1;
    }

    /* RESPONSIVE */
    @media (max-width: 1024px) {
      .hero {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 2rem;
        max-width: 800px;
      }
      
      .hero-image::before {
        display: none;  /* Hide shadow on mobile */
      }
    }

    @media (max-width: 640px) {
      .hero { margin: 1.5rem auto; padding: 0 1rem; }
      .hero-buttons { justify-content: center; }
      .btn { width: 100%; max-width: 240px; justify-content: center; }
    }
  </style>
</head>
<body>
  <!-- NAVBAR -->
  <div id="site-header"></div>

  <section class="hero">
    <div class="hero-content">
      <h1>Data Minimisation<br>for Healthcare Providers</h1>
      <p>Protect your data by practicing data minimisation while serving your healthcare clients effectively.</p>
      
      <div class="hero-buttons">
        <a href="../templates/WelcomeQuestionnaire.html" class="btn btn-primary" onclick="startAssessment()">
          Get Started
        </a>
        <a href="#" class="btn btn-secondary" onclick="viewGuide()">
          Learn More
        </a>
      </div>
    </div>

    <div class="hero-image">
      <img src="../assets/img/imgMin.png" alt="Data minimisation illustration">
    </div>
  </section>

  <script src="../static/js/header-loader.js"></script>
</body>
</html>
