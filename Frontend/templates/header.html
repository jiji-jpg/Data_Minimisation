<!-- header.html - COMPLETE VERSION WITH CSS -->
<!DOCTYPE html>
<html>
<head>
<style>
      /* RESET */
    * { margin: 0; padding: 0; box-sizing: border-box; }
.navbar {
  background-color: #0b1b3a;
  color: #ffffff;
  font-family: system-ui, sans-serif;
  margin: 0;
  padding: 0;
  width: 100vw;          /* ← Full viewport width */
  position: relative;
  left: 50%;
  right: 50%;
  margin-left: -50vw;
  margin-right: -50vw;
}

.nav-inner {
  max-width: 1400px;     /* ← Wider content area */
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 2rem;             /* ← Space between logo/links/icons */
  height: 60px;
}

.nav-logo img {
  height: 32px;  /* Adjust to fit your logo */
  width: auto;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 2rem;             /* ← More space between nav items */
  flex: 1;               /* ← Takes available space */
  justify-content: center;
}

.nav-links a {
  color: #ffffff;
  text-decoration: none;
  font-size: 14px;
  padding: 8px 0;
}

.nav-links a:hover {
  text-decoration: underline;
}

/* Dropdown */
.dropdown {
  position: relative;
}

.dropbtn {
  background: none;
  border: none;
  color: #ffffff;
  cursor: pointer;
  font-size: 14px;
  padding: 8px 0;
}

.dropdown-content {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  background-color: #101c3d;
  min-width: 220px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.35);
  z-index: 1000;
}

.dropdown-content a {
  display: block;
  padding: 12px 16px;
  color: #ffffff;
  text-decoration: none;
}

.dropdown:hover .dropdown-content {
  display: block;
}

.nav-icons svg {
  display: block;
}

.nav-icons a {
  color: #ffffff;
  padding: 8px;
  border-radius: 4px;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem; 
  margin-left: auto;
}

.nav-icons a:hover {
  background-color: rgba(255,255,255,0.1);
}

</style>
</head>
<body>
<header class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
        <img src="../assets/img/logo.png" alt="FlameTree Cyber" width="140" height="32">
    </a>
    <nav class="nav-links">
      <a href="#">About</a>
      <a href="#">Projects</a>
      <div class="dropdown">
        <button class="dropbtn">Services</button>
        <div class="dropdown-content">
          <a href="#">Compliance & Assurance</a>
          <a href="#">Incident Resilience</a>
          <a href="#">Cyber Maturity Uplift</a>
          <a href="#">Privacy Risk Maturity</a>
          <a href="#">GRC Alignment</a>
          <a href="#">Responsible AI</a>
          <a href="../templates/DMInfoPage.html">Data Minimisation v3</a>
        </div>
      </div>
      <a href="#">Blogs/News</a>
      <a href="#">Contact</a>
    </nav>
    
    <div class="nav-icons">
    <!-- Email SVG icon -->
        <a href="mailto:hello@flametreecyber.com" title="Email">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
        </a>
  
        <!-- Phone SVG icon -->
        <a href="tel:+61400000000" title="Call">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
            </svg>

         <a href="#" title="Search" onclick="toggleSearch()">

    </div>
  </div>
</header>
</body>
</html>
